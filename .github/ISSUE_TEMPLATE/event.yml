
name: Event einreichen
description: Veranstaltung rund um FOSS in Baden‑Württemberg melden
title: "[Event] {{ Title }} — {{ City }}"
labels: ["event:submitted"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: Titel (de)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Kurzbeschreibung (de)
    validations:
      required: true

  - type: input
    id: start
    attributes:
      label: Start
      description: Beginn (ISO, z.B. 2025-12-12T18:00:00+01:00)
    validations:
      required: true

  - type: input
    id: end
    attributes:
      label: End
      description: Ende (optional, ISO)
    validations:
      required: false

  - type: input
    id: timezone
    attributes:
      label: Timezone
      description: Zeitzone (IANA, z.B. Europe/Berlin)
      placeholder: Europe/Berlin
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Ort (Adresse oder Online-Link)
    validations:
      required: true

  - type: input
    id: city
    attributes:
      label: City
      description: Stadt/Ort in BW
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Kategorie (de)
      options:
        - Meetup
        - Workshop
        - Konferenz
        - Hackathon
        - Vortrag
        - Sonstiges
    validations:
      required: true

  - type: input
    id: organizer
    attributes:
      label: Organizer
      description: Veranstalter (Person/Firma)
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: Event-Webseite/Anmeldung
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Consent
      description: Einverständnis
      options:
        - label: Ich bestätige, dass die Angaben korrekt sind und öffentlich erscheinen dürfen.
          required: true
