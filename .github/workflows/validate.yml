
name: Validate Event Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure issue body exists
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          if [ -z "${BODY// }" ]; then
            echo "❌ Issue body ist leer. Bitte das 'Event einreichen'-Formular nutzen."
            exit 1
          fi

      - name: Parse Issue Form -> JSON
        id: parse
        uses: zentered/issue-forms-body-parser@v2.2.0
        with:
          body: ${{ github.event.issue.body }}

      - name: Guard parsed JSON presence
        env:
          RAW: ${{ steps.parse.outputs.data }}
        run: |
          if [ -z "${RAW// }" ] || [ "${RAW}" = "null" ]; then
            echo "❌ Parser-Ausgabe leer oder 'null'. Wurde das Issue-Formular verwendet?"
            exit 1
          fi
          # WICHTIG: NICHT toJSON verwenden – direkt schreiben
          echo "${RAW}" > event.json
          echo "✅ Parser-Output geschrieben: event.json"

      - name: Basic checks (robust)
        run: |
          node -e "
            const fs = require('fs');
            let raw = fs.readFileSync('event.json','utf8');
            let data;
            try {
              data = JSON.parse(raw);
            } catch {
              // Falls doppelt serialisiert (z. B. \"{...}\")
              data = JSON.parse(JSON.parse(raw));
            }

            // Deine aktuellen Keys aus den Überschriften (deutsche Slugs):
            const required = [
              'titel',
              'kurzbeschreibung',
              'beginn-iso-z-b-2025-12-12-t18-00-00-01-00',
              'zeitzone-iana-z-b-europe-berlin',
              'ort-adresse-oder-online-link',
              'stadt-ort-in-bw',
              'kategorie',
              'veranstalter-person-firma',
              'event-webseite-anmeldung'
            ];

            const missing = required.filter(k => !(k in data) || !String(data[k]?.text || '').trim());
            if (missing.length) {
              console.error('❌ Fehlende oder leere Felder (via .text):', missing);
              process.exit(1);
            } else {
              console.log('✅ Validierung OK');
            }
          "

      - name: Label as approved
        if: ${{ success() }}
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: "event:approved"
