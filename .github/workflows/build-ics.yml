
name: Build & Publish ICS

on:
  issues:
    types: [labeled]
#  schedule:
#    - cron: "0 * * * *"   # stündlich neu generieren

permissions:
  contents: write
  issues: read


jobs:
  ics:
    if: contains(github.event.issue.labels.*.name, 'event:approved') || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Preview der genehmigten Issues & geparsten Felder ---
      - name: Preview parsed event fields (what will go into ICS)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "🔎 Lade offene Issues mit Label 'event:approved'…"
          gh api -X GET "repos/${REPO}/issues?state=open&labels=event:approved&per_page=50" > issues.json
          echo "Gefundene Issues:"
          jq -r '.[].number' issues.json || true

          node <<'NODE'
          const fs = require('fs');
          const issues = JSON.parse(fs.readFileSync('issues.json','utf8'));

          // kleine Helper-Funktion: Markdown-Body nach ### Headings durchsuchen
          const pick = (body, heading) => {
            if (!body) return '';
            const regex = new RegExp(`^###\\s*${heading}\\s*\\n+([\\s\\S]*?)(?:\\n###\\s|$)`, 'mi');
            const m = body.match(regex);
            return m ? m[1].trim() : '';
          };

          const fields = ["Title","Description","Start","End","Timezone","Location","City","Category","Organizer","URL"];
          const rows = [];
          for (const it of issues) {
            const row = { number: it.number, html_url: it.html_url };
            for (const f of fields) row[f.toLowerCase()] = pick(it.body, f);
            rows.push(row);
          }

          if (rows.length === 0) {
            console.log("⚠️  Keine offenen Issues mit Label 'event:approved' gefunden.");
          } else {
            console.log("🧾 Vorschau (gekürzt):");
            for (const r of rows) {
              console.log(`- #${r.number} → ${r.html_url}`);
              console.log(`  Title:     ${r.title}`);
              console.log(`  Start:     ${r.start}   End: ${r.end}   TZ: ${r.timezone}`);
              console.log(`  City:      ${r.city}    Location: ${r.location}`);
              console.log(`  URL:       ${r.url}`);
              console.log(`  Category:  ${r.category}   Organizer: ${r.organizer}`);
              console.log(`  Description: ${r.description.substring(0,120).replace(/\n/g,' ')}${r.description.length>120?'…':''}`);
              console.log('');
            }
          }
          NODE

# --- debug

      - name: Fetch issues (open + approved)
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Hole alle offenen Issues mit Label "event:approved"
          curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/issues?state=open&labels=event:approved&per_page=100" \
            > issues.json

          echo "Fetched issues count:"
          jq 'length' issues.json

          echo "Titles + labels:"
          jq -r '.[] | "\(.number)  \(.title)  [\(.labels|map(.name)|join(", "))]"' issues.json

      - name: Abort if no approved issues
        shell: bash
        run: |
          set -euo pipefail
          cnt=$(jq 'length' issues.json)
          if [ "$cnt" -eq 0 ]; then
            echo "::warning::No open issues with label event:approved. ICS will be empty."
            # optional: exit non-zero, wenn du den Run abbrechen willst:
            # exit 1
          fi

# --- eigenes parsen und ICS schreiben

        - name: Parse Issue bodies (### headings -> events.json)
          shell: bash
          run: |
            set -euo pipefail
            python3 - << 'PY'
        import json, re
        
        def strip_crlf(s: str) -> str:
            # Normalisiere CRLF -> LF
            return s.replace('\r\n', '\n').replace('\r', '\n')
        
        def grab_section(md: str, heading_regex: str) -> str:
            """
            Sucht eine Überschrift (##...###...) und extrahiert den Abschnitt bis zur nächsten Überschrift.
            Gibt die ERSTE NICHT-LEERE ZEILE dieses Abschnitts zurück.
            """
            md = strip_crlf(md)
            # Überschrift: mind. zwei oder drei # erlauben, führende/trailing spaces robust
            pattern = rf"^#{2,6}\s*(?:{heading_regex})\s*$\n+([\s\S]*?)(?=^\s*#{2,6}\s|\Z)"
            m = re.search(pattern, md, flags=re.IGNORECASE | re.MULTILINE)
            if not m:
                return ""
            block = m.group(1).strip()
            # Nimm die erste nicht-leere Zeile als Wert
            for line in block.split("\n"):
                line = line.strip()
                if line:
                    return line
            return ""
        
        def parse_heading_body(md: str):
            return {
                "title":       grab_section(md, "Title|Titel"),
                "description": grab_section(md, "Description|Kurzbeschreibung"),
                "date":        grab_section(md, "Date|Datum"),
                "time":        grab_section(md, "Time|Startzeit|Zeit|Uhrzeit"),
                "location":    grab_section(md, "Location|Ort|Adresse"),
                "city":        grab_section(md, "City|Stadt"),
                "url":         grab_section(md, "URL|Webseite|Anmeldung|Link"),
            }
        
        issues = json.load(open("issues.json"))
        events = []
        
        for it in issues:
            body = it.get("body") or ""
            data = parse_heading_body(body)
        
            # Debug-Logging (optional, hilft beim Abgleich im Actions-Log)
            print("::group::Parsed fields for issue #", it.get("number"))
            for k,v in data.items():
                print(f"{k}: {v}")
            print("::endgroup::")
        
            # Zeit normalisieren: "18:00-20:00" sowie "18:00–20:00" unterstützen
            t = (data.get("time") or "").replace("–","-").replace("—","-")
            dtstart = dtend = None
            if data.get("date") and t:
                if "-" in t:
                    s, e = [x.strip() for x in t.split("-", 1)]
                    if s:
                        dtstart = f"{data['date']} {s}"
                    if e:
                        dtend   = f"{data['date']} {e}"
                else:
                    dtstart = f"{data['date']} {t.strip()}"
        
            events.append({
                "number": it["number"],
                "title": data.get("title") or it["title"],
                "description": (data.get("description") or "").replace("\n", "\\n"),
                "location": data.get("location") or "",
                "city": data.get("city") or "",
                "url": data.get("url") or "",
                "date": data.get("date") or "",
                "time": data.get("time") or "",
                "dtstart": dtstart,
                "dtend": dtend
            })
        
        with open("events.json","w", encoding="utf-8") as f:
            json.dump(events, f, ensure_ascii=False, indent=2)
        PY


      - name: Sanity check — parsed events
        shell: bash
        run: |
          set -euo pipefail
          echo "Parsed events count:"
          jq 'length' events.json
          jq '.[0]' events.json || true



      - name: Build events.ics (Europe/Berlin)
        shell: bash
        run: |
          set -euo pipefail

          echo "BEGIN:VCALENDAR" > events.ics
          echo "PRODID:-//FOSS LÄND Community//Events//DE" >> events.ics
          echo "VERSION:2.0" >> events.ics
          echo "CALSCALE:GREGORIAN" >> events.ics
          echo "METHOD:PUBLISH" >> events.ics
          echo "X-WR-CALNAME:FOSS LÄND Community-Kalender" >> events.ics
          echo "X-WR-TIMEZONE:Europe/Berlin" >> events.ics
          cat << 'EOF' >> events.ics
          BEGIN:VTIMEZONE
          TZID:Europe/Berlin
          X-LIC-LOCATION:Europe/Berlin
          BEGIN:DAYLIGHT
          TZOFFSETFROM:+0100
          TZOFFSETTO:+0200
          TZNAME:CEST
          DTSTART:19700329T020000
          RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU
          END:DAYLIGHT
          BEGIN:STANDARD
          TZOFFSETFROM:+0200
          TZOFFSETTO:+0100
          TZNAME:CET
          DTSTART:19701025T030000
          RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU
          END:STANDARD
          END:VTIMEZONE
          EOF

          python3 - << 'PY' >> events.ics
          import json, datetime
          from datetime import timezone
          
          def ics_dt_local(s):  # "YYYY-MM-DD HH:MM" -> "YYYYMMDDTHHMMSS"
              return datetime.datetime.strptime(s,"%Y-%m-%d %H:%M").strftime("%Y%m%dT%H%M%S")
          
          events = json.load(open("events.json"))
          now = datetime.datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          
          for ev in events:
              if not ev.get("dtstart"):
                  # überspringe, wenn Startzeit fehlt
                  continue
              uid = f"issue-{ev['number']}-{(ev['date'] or 'unknown')}-{(ev['city'] or 'nocity')}".lower()+"@foss-laend.example.org"
              summary = f"[Event] {ev['title']}" + (f" — {ev['city']}" if ev.get("city") else "")
              print("BEGIN:VEVENT")
              print(f"UID:{uid}")
              print(f"DTSTAMP:{now}")
              print(f"SUMMARY:{summary}")
              if ev.get("description"): print(f"DESCRIPTION:{ev['description']}")
              if ev.get("location"):    print(f"LOCATION:{ev['location']}")
              if ev.get("url"):         print(f"URL:{ev['url']}")
              print(f"DTSTART;TZID=Europe/Berlin:{ics_dt_local(ev['dtstart'])}")
              if ev.get("dtend"): print(f"DTEND;TZID=Europe/Berlin:{ics_dt_local(ev['dtend'])}")
              print("STATUS:CONFIRMED")
              print("END:VEVENT")
          PY

          echo "END:VCALENDAR" >> events.ics

      - name: Guard — ensure VEVENT exists
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(grep -c '^BEGIN:VEVENT' events.ics || true)" -eq 0 ]; then
            echo "::error::events.ics contains no VEVENT entries (empty calendar)."
            exit 1
          fi








          

      # --- Bestehender ICS-Build ---
#      - name: Generate events.ics from issues
#        uses: gitevents/ics@v1.4.3
#        with:
#          repo-token: ${{ secrets.GITHUB_TOKEN }}
#          default-timezone: 'Europe/Berlin'
          # locations: 'locations.json'

      - name: Commit updated calendar
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "events.ics" ]]; then
            git config user.name "foss-laend-bot"
            git config user.email "calendar@foss-laend.example"
            git add events.ics
            if ! git diff --cached --quiet; then
              git commit -m "Update events.ics"
              git push
            else
              echo "No changes in events.ics; nothing to commit."
            fi
          else
            echo "events.ics not found; skipping commit"
            exit 1
          fi
