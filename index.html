
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>FOSS‑LÄND Kalenderle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --pad: 24px;
      --border: #e5e5e5;
      --bg: #fff;
      --bg-header: #fafafa;
      --text: #111;
      --maxw: 1200px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    /* Kopfbereich: Titel links, Logo (SVG) rechts */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px var(--pad);
      border-bottom: 1px solid var(--border);
      background: var(--bg-header);
    }
    .site-title {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .logo {
      display: block;
      height: 48px;     /* Logo-Größe hier anpassen, falls gewünscht */
      width: auto;
    }

    /* Seite / Inhalt */
    .page {
      padding: var(--pad);
      max-width: var(--maxw);
      margin: 0 auto;
    }
    .intro {
      margin: 0 0 16px 0;
      font-size: 1.05rem;
      color: #333;
    }

    /* Kalender-iFrame: responsiv + Mindesthöhe */
    .calendar-frame {
      width: 100%;
      height: 80vh;         /* 80% der Fensterhöhe */
      min-height: 720px;    /* nicht kleiner als 720px am Desktop */
      border: none;
      background:
        url('https://raw.githubusercontent.com/niccokunzmann/open-web-calendar/master/static/img/loaders/circular-loader.gif')
        center center no-repeat;
    }

    /* Mobile */
    @media (max-width: 460px) {
      .site-header { flex-direction: column; align-items: flex-start; }
      .logo { height: 40px; }
      .calendar-frame {
        height: 70vh;
        min-height: 520px;
      }
    }
  </style>
</head>

<body>
  <!-- Kopfbereich: Titel + echtes JPG-Logo -->
  <header class="site-header">
    <h1 class="site-title">FOSS‑LÄND Kalenderle</h1>
    <assets/Logo_Automotive_Software_Collaboration_BW.jpg
  </header>


  <!-- Inhalt: Beschreibungstext + Kalender -->
  <main class="page">
    <p class="intro">Hier findest du alle Veranstaltungen rund um Freie und Open‑Source‑Software (FOSS) in Baden‑Württemberg.</p>

    <iframe
      class="calendar-frame"
      id="open-web-calendar"
      title="FOSS‑LÄND – Kalender"
      src="https://open-web-calendar.hosted.quelltext.eu/calendar.html?language=de&url=https%3A%2F%2Fraw.githubusercontent.com%2Fjtdemer%2Ffoss-laend-events-test%2Frefs%2Fheads%2Fmain%2Fevents.ics"
      sandboxdie <atps://raw.githubusercontent.com/jtdemer/foss-laend-events-test/refs/heads/main/events.icsICS-Datei</a> herunterladen.</p>
    </noscript>
  </main>
</body>
