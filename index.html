
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>FOSS‑LÄND Kalenderle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --pad: 24px;
      --border: #e5e5e5;
      --bg: #fff;
      --bg-header: #fafafa;
      --text: #111;
      --maxw: 1200px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    /* Kopfbereich: Titel links, Logo rechts – kompakt und ohne Umbruch */
    .site-header {
      display: flex;
      align-items: center;        /* Header wird nicht „hochgezogen“ */
      justify-content: space-between;
      gap: 16px;
      padding: 12px var(--pad);   /* kleiner als zuvor */
      border-bottom: 1px solid var(--border);
      background: var(--bg-header);
      flex-wrap: nowrap;          /* sicherstellen, dass nichts in die nächste Zeile geht */
    }
    .site-title {
      margin: 0;
      font-size: 1.6rem;          /* etwas kleiner */
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .logo {
      display: block;
      height: 40px;               /* kompakte Logo-Höhe */
      width: auto;
      max-width: 260px;           /* sehr breite Logos begrenzen */
      object-fit: contain;
    }

    /* Seiten-Container für Intro + Kalender */
    .page {
      padding: var(--pad);
      max-width: var(--maxw);
      margin: 0 auto;
    }
    .intro {
      margin: 0 0 12px 0;
      font-size: 1.02rem;
      color: #333;
      text-align: left;
    }

    /* Kalender: volle Breite, angenehme Höhe, nicht zu dominant */
    .calendar-frame {
      width: 100%;
      height: 72vh;          /* etwas niedriger als 80vh, wirkt luftiger */
      min-height: 640px;     /* Desktop-Mindesthöhe */
      border: none;
      background:
        url('https://raw.githubusercontent.com/niccokunzmann/open-web-calendar/master/static/img/loaders/circular-loader.gif')
        center center no-repeat;
    }

    /* Mobile Feinschliff */
    @media (max-width: 600px) {
      .site-header { padding: 10px 16px; }
      .logo { height: 36px; max-width: 220px; }
      .site-title { font-size: 1.4rem; }
    }
    @media (max-width: 460px) {
      .site-header { flex-direction: column; align-items: flex-start; }
      .calendar-frame { height: 64vh; min-height: 520px; }
    }
  </style>
</head>
<body>
  <!-- WICHTIG: Header ist nur Titel + Logo und wird korrekt geschlossen -->
  <header class="site-header">
    <h1 class="site-title">FOSS‑LÄND Kalenderle</h1>
     <a
       class="logo-link"
       href="https://www.foss.e-mobilbw.de"
      >
    <img
       class="logo"
       src="assets/Logo_Automotive_Software_Collaboration_BW.png"
       alt="Logo Automotive Software Collaboration BW"
      />
      </a>
  </header>

  <!-- Inhalt liegt außerhalb des Headers -->
  <main class="page">
    <p class="intro">
      Hier findest du alle Veranstaltungen rund um Freie und Open‑Source‑Software (FOSS) in Baden‑Württemberg.
    </p>

    <iframe
      class="calendar-frame"
      id="open-web-calendar"
      title="FOSS‑LÄND – Kalenderle"
      src="https://open-web-calendar.hosted.quelltext.eu/calendar.html?language=de&url=https%3A%2F%2Fraw.githubusercontent.com%2Fjtdemer%2Ffoss-laend-events-test%2Frefs%2Fheads%2Fmain%2Fevents.ics"
      sandbox="allow-scripts allow-same-origin allow-popups allow-top-navigation-by-user-activation"
      loading="lazy"
      referrerts-test/refs/headsnts.icsICS-Datei      referrerts-test/refs/headsnts.icsICS-Datei</a> herunterladen.</p>
    </noscript>
  </main>
</body>
